name: Feature Request
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！提交前请先在 [Issues](https://github.com/xianshi3/Reality-Blog/issues) 中搜索，确认没有重复。
  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 清晰简洁地描述你遇到的需求或痛点。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望看到的功能或行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案或替代做法。
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 其他上下文或截图。
