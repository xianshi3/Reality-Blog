name: Bug Report
description: 提交一个问题报告，帮助改进 Reality Blog
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢花时间填写问题报告！提交前请先在 [Issues](https://github.com/xianshi3/Reality-Blog/issues) 中搜索，确认没有重复。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述遇到的问题。
      placeholder: 例如：在文章详情页点赞后数字没有变化……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出复现问题的步骤。
      placeholder: |
        1. 打开页面 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 观察到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 如果有截图或控制台日志，请粘贴（可直接拖拽图片）。
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器 / 操作系统 / Node 版本等。
      placeholder: 例如：Chrome 126 / Windows 11 / Node 20
    validations:
      required: false
